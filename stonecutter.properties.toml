# Propiedades centralizadas por versión
# https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "takumi_skins"
mod.name = "Takumi Skins"
mod.group = "com.takumistudios.takumi_skins"
mod.version = "0.1.1"

deps.fabric_loader = "0.20.1"
# mod.min_loader y mod.min_fabric_api (por versión) son lo mínimo que exige el jar: el Loader que pide su Fabric API y
# la primera Fabric API publicada en Modrinth para la versión de Minecraft más antigua del nodo (las anteriores de Maven
# son de snapshots o pre-releases y no arrancan en la versión final)
deps.java = "25"

["26.1.2"]
mod.mc_compat = ">=26.1 <26.2-"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
mod.min_loader = "0.18.4"
mod.min_fabric_api = "0.144.0"
deps.fabric_api = "0.155.3+26.1.2"
compat.lithium = "mc26.1.2-0.24.7-fabric"
compat.ferritecore = "9.0.0-fabric"
compat.sodium = "mc26.1.2-0.9.2-fabric"
compat.sodium_iris = ""
compat.iris = "1.11.4+26.1-fabric"
compat.emf = "3.3.12-fabric-26.1"
compat.etf = "7.2.7-fabric-26.1"
compat.customskinloader = "15.1-Universal"

["26.2"]
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]
mod.min_loader = "0.18.4"
mod.min_fabric_api = "0.152.1"
deps.fabric_api = "0.161.0+26.2"
compat.lithium = "mc26.2-0.25.3-fabric"
compat.ferritecore = "9.0.0-fabric"
compat.sodium = "mc26.2-0.9.2-fabric"
compat.sodium_iris = ""
compat.iris = "1.11.4+26.2-fabric"
compat.emf = "3.3.12-fabric-26.2"
compat.etf = "7.2.7-fabric-26.2"
compat.customskinloader = "15.1-Universal"

["26.3"]
mod.mc_compat = "~26.3"
mod.mc_releases = ["26.3"]
mod.min_loader = "0.19.3"
mod.min_fabric_api = "0.160.5"
deps.fabric_api = "0.166.2+26.3"
compat.lithium = "mc26.3-0.26.2-fabric"
compat.ferritecore = "9.0.0-fabric"
compat.sodium = "mc26.3-0.9.3-fabric"
# Sodium 0.9.3 declara breaks iris <=1.12.0: el pack con Iris usa la Sodium que pide Iris 1.11.7 (la que tienen los
# jugadores con Iris); -PcompatPack=noiris prueba la última Sodium sola
compat.sodium_iris = "mc26.3-0.9.2-fabric"
compat.iris = "1.11.7+26.3-fabric"
compat.emf = "3.3.12-fabric-26.3"
compat.etf = "7.2.7-fabric-26.3"
compat.customskinloader = "15.1-Universal"

["1.21.1"]
mod.mc_compat = "1.21.1"
mod.mc_releases = ["1.21.1"]
mod.min_loader = "0.16.14"
mod.min_fabric_api = "0.116.4"
deps.java = "21"
deps.fabric_api = "0.116.18+1.21.1"
compat.lithium = "mc1.21.1-0.15.3-fabric"
compat.ferritecore = "7.0.3-fabric"
compat.sodium = "mc1.21.1-0.8.13-fabric"
compat.sodium_iris = ""
compat.iris = "1.8.14-beta.1+1.21.1-fabric"
compat.emf = "3.3.12-fabric-1.21"
compat.etf = "7.2.7-fabric-1.21"
# CustomSkinLoader no arranca en el entorno de desarrollo de 1.21.1 (reglas con nombres intermediary): solo va en
# prodRunClient
compat.customskinloader = "15.1-Universal"
