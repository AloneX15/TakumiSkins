name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela el run anterior (ahorra minutos y evita dev-releases desordenadas)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: TakumiStudios standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authorship and metadata
        run: |
          node <<'JS'
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync('src/main/resources/fabric.mod.json', 'utf8'));
          if (!metadata.authors?.includes('TakumiStudios')) throw new Error('Missing TakumiStudios authorship');
          for (const key of ['license', 'icon', 'contact']) {
            if (!metadata[key]) throw new Error(`Missing metadata: ${key}`);
          }
          // El launcher inyecta el mod en instancias ajenas: no puede exigir Fabric API
          if (metadata.depends?.['fabric-api'] || metadata.depends?.['fabric']) throw new Error('fabric.mod.json must not depend on Fabric API');
          for (const file of ['README.md', 'LICENSE', 'CHANGELOG.md', 'SECURITY.md', 'MIXINS.md']) {
            if (!fs.existsSync(file)) throw new Error(`Missing file: ${file}`);
          }
          if (!fs.readFileSync('README.md', 'utf8').includes('TakumiStudios')) throw new Error('Missing README authorship');
          JS

      - name: Code hygiene
        run: |
          fail=0
          # Nada de salida por consola ni trazas sueltas: todo pasa por el logger del mod
          if grep -rnE 'System\.(out|err)\.print|\.printStackTrace\(\)' src/main src/client src/native 2>/dev/null; then
            echo "::error::usa el logger del mod en lugar de System.out/err o printStackTrace"; fail=1
          fi
          # Sin Fabric API en el mod (solo en los tests): el jar debe funcionar en instancias sin ella
          if grep -rn 'net\.fabricmc\.fabric\.api' src/main src/client src/native 2>/dev/null; then
            echo "::error::Takumi Skins no puede usar Fabric API (solo Fabric Loader)"; fail=1
          fi
          # Si hay mixins, deben estar documentados
          if [ -n "$(find src -name '*.mixins.json' 2>/dev/null)" ] && [ ! -f MIXINS.md ]; then
            echo "::error::el mod usa mixins y falta MIXINS.md"; fail=1
          fi
          exit $fail

      - name: Translations (en_us y es_es con las mismas claves)
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            let fail = false;
            const ls = d => fs.existsSync(d) ? fs.readdirSync(d) : [];
            const dirs = ls("src").flatMap(s => ls(`src/${s}/resources/assets`).map(ns => `src/${s}/resources/assets/${ns}/lang`));
            for (const dir of dirs.filter(d => fs.existsSync(d))) {
              const load = f => JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              if (!fs.existsSync(path.join(dir, "en_us.json"))) continue;
              const base = Object.keys(load("en_us.json"));
              if (!fs.existsSync(path.join(dir, "es_es.json"))) { console.log(`::error::falta ${dir}/es_es.json`); fail = true; }
              for (const f of fs.readdirSync(dir).filter(f => f.endsWith(".json") && f !== "en_us.json")) {
                const keys = new Set(Object.keys(load(f)));
                const missing = base.filter(k => !keys.has(k));
                if (missing.length) { console.log(`::error file=${dir}/${f}::faltan ${missing.length} claves: ${missing.slice(0, 10).join(", ")}`); fail = true; }
              }
            }
            process.exit(fail ? 1 : 0);
          '

      - uses: gradle/actions/wrapper-validation@v6

  # Compilación, unitarios y arranque del cliente en las doce combinaciones de versión y cargador
  loaders:
    name: ${{ matrix.loader }} MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.1", "26.1.2", "26.2", "26.3"]
        loader: [fabric, forge, neoforge]
    env:
      NODE: ${{ matrix.loader == 'fabric' && matrix.minecraft || format('{0}-{1}', matrix.minecraft, matrix.loader) }}
      # Fabric ejecuta el juego en run/ (raíz); Forge/NeoForge en versions/<nodo>/run
      RUN_DIR: ${{ matrix.loader == 'fabric' && 'run' || format('versions/{0}-{1}/run', matrix.minecraft, matrix.loader) }}
    steps:
      - uses: actions/checkout@v7
      # JDK 8: ForgeGradle lo usa para preparar Minecraft (lo busca en JAVA_HOME_8_X64). Zulu porque el Temurin 8u514
      # que descargaría falla la verificación de checksum (22-11-2026). Va antes para que JAVA_HOME acabe en el 25.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and unit tests
        run: ./gradlew :$NODE:build --stacktrace
      - name: Install client graphics runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Client startup (mixins applied, vanilla skin untouched without a launcher token)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render"
          ./gradlew :$NODE:runClient -PskinsClientSmoke --console=plain
      - name: Check client result
        run: >-
          python3 -c 'import json, os; from pathlib import Path;
          r = json.loads(Path(os.environ["RUN_DIR"], "takumi-skins-smoke.json").read_text()); print(r); assert r["success"]'
      - uses: actions/upload-artifact@v7
        with:
          name: takumi_skins-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: |
            versions/${{ env.NODE }}/build/libs/*.jar
            !versions/${{ env.NODE }}/build/libs/*-sources.jar
            !versions/${{ env.NODE }}/build/libs/*-dev.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            ${{ env.RUN_DIR }}/logs/
            versions/${{ env.NODE }}/build/reports/

  # Punta a punta en un cliente real: web simulada con token, el jugador lleva la skin, la capa y los brazos de Takumi
  client:
    name: Client test MC ${{ matrix.minecraft }}${{ matrix.compat && format(' (compat pack {0})', matrix.compat) || '' }}
    runs-on: ubuntu-latest
    # Si el juego se cuelga (p. ej. sin contexto gráfico), el job no puede bloquear la CI
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Sin 1.21.1: su API de tests de cliente no existe (lo cubre el arranque del job loaders)
        minecraft: ["26.1.2", "26.2", "26.3"]
        # full: pack completo con Iris y el shaderpack de prueba activado (con la Sodium que admite Iris)
        compat: ["", full]
        include:
          # 26.3: Sodium 0.9.3 rompe Iris 1.11.x, así que la última Sodium se prueba aparte, sin Iris
          - minecraft: "26.3"
            compat: noiris
          # Iris necesita OpenGL y en Xvfb el selector GLX de SDL3 no encuentra visual para 26.3 (sin Iris, el juego
          # pasa a Vulkan): el contexto OpenGL se crea por EGL
          - minecraft: "26.3"
            compat: full
            egl: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-utils mesa-vulkan-drivers vulkan-tools
      - name: Client gametest
        env:
          # Renderizado por software (Mesa): 26.3 necesita un visual GLX de 24 bits y acaba usando Vulkan con lavapipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: ${{ matrix.egl && '1' || '0' }}
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render"
          ./gradlew :${{ matrix.minecraft }}:runClientGameTest ${{ matrix.compat && format('-PcompatPack={0}', matrix.compat) || '' }} --stacktrace
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-mc${{ matrix.minecraft }}${{ matrix.compat && format('-compat-{0}', matrix.compat) || '' }}
          path: versions/${{ matrix.minecraft }}/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
      - name: Upload client logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: client-logs-mc${{ matrix.minecraft }}${{ matrix.compat && format('-compat-{0}', matrix.compat) || '' }}
          path: versions/${{ matrix.minecraft }}/build/run/clientGameTest/logs/
          if-no-files-found: ignore

  # 1.21.1 como en una instancia real de Takumi Launcher: Minecraft ofuscado y los jars publicados, contra una web
  # simulada. Entra en un mundo y el jugador debe llevar la skin de Takumi. Aquí funcionan Iris (con shaders) y
  # CustomSkinLoader, que no arrancan en el entorno de desarrollo de 1.21.1.
  production:
    name: Production run MC 1.21.1${{ matrix.compat && format(' (compat pack {0})', matrix.compat) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compat: ["", full]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Production client
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render"
          ./gradlew :1.21.1:prodRunClient ${{ matrix.compat && format('-PcompatPack={0}', matrix.compat) || '' }} --console=plain
      - name: Check client result
        run: >-
          python3 -c 'import json; from pathlib import Path;
          r = json.loads(Path("versions/1.21.1/build/run/prod/takumi-skins-smoke.json").read_text()); print(r); assert r["success"]'
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-prod-mc1.21.1${{ matrix.compat && format('-compat-{0}', matrix.compat) || '' }}
          path: versions/1.21.1/build/run/prod/screenshots/
          if-no-files-found: ignore
      - name: Upload client logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prod-logs-mc1.21.1${{ matrix.compat && format('-compat-{0}', matrix.compat) || '' }}
          path: versions/1.21.1/build/run/prod/logs/
          if-no-files-found: ignore

  dev-release:
    name: Publish dev build
    # Solo en pushes a main y solo si todas las pruebas pasaron
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [standards, loaders, client, production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Nunca dos dev-releases a la vez (borrar + crear no es atómico)
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: takumi_skins-*
          path: jars
          merge-multiple: true
      - name: Launcher index
        run: node scripts/release-index.mjs jars dev "$GITHUB_REPOSITORY" > takumi-skins.json
      - name: Replace the "dev" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev jars/*.jar takumi-skins.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build ($(echo "$GITHUB_SHA" | cut -c1-7))" \
            --notes "Build automática de la rama main, generada tras pasar todas las pruebas en MC 1.21.1, 26.1.2, 26.2 y 26.3.

          Puede tener cambios sin publicar oficialmente. Takumi Launcher instala solo el jar de cada instancia (takumi-skins.json); el mod no hace nada fuera de Takumi Launcher.

          Commit: $GITHUB_SHA

          Creado por TakumiStudios."
